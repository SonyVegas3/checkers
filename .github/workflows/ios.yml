name: iOS app

# Builds the iPhone/iPad app with BeeWare Briefcase on a GitHub macOS runner and
# uploads an **unsigned** .ipa.  iOS binaries cannot be produced on Windows, so
# this workflow is the "no Mac at home" path.
#
# Briefcase only builds for the simulator and refuses to create a distributable
# IPA, so scripts/build_ipa.sh does the last step: it runs xcodebuild for the
# iphoneos SDK with code signing disabled and wraps the .app in Payload/.  The
# result is not signed for any device - iLoader / Sideloadly / AltStore re-sign
# it with your own certificate when you install it (no Apple account needed).

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-*"

# the failure log is pushed to the "ci-log" branch, which needs write access
permissions:
  contents: write

jobs:
  ipa:
    # Briefcase 0.4.6 requires Xcode 26, so the runner must be a macOS 26 image
    # (macos-15 only ships Xcode 16 and the build stops with "Xcode 26.0 is
    # required; 16.4 is installed").
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          python -m pip install "briefcase>=0.4"

      - name: Engine + iOS bridge tests (no browser needed)
        run: python -m unittest tests.test_engine tests.test_ios_site.BridgeTests

      - name: Build the unsigned IPA
        run: |
          set -o pipefail
          bash scripts/build_ipa.sh 2>&1 | tee build.log

      - name: Upload the Xcode build log (only when the build fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild-ios.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish the build log + IPA report to the "ci-log" branch
        if: always()
        run: |
          cp build.log ci-build.log 2>/dev/null || echo "no build.log" > ci-build.log
          cp dist/ipa-report.txt ci-ipa-report.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-log
          git add -f ci-build.log
          if [ -f ci-ipa-report.txt ]; then git add -f ci-ipa-report.txt; fi
          git commit -m "ci: run ${GITHUB_RUN_NUMBER} log + IPA report" || true
          git push -f origin ci-log

      - name: List the artefacts
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: CheckersBot-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30
